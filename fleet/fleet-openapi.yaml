                          type: string
                      latest_version:
                        type: string
                      self_service:
                        type: boolean
                      labels_include_any:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            id:
                              type: integer
                      automatic_install_policies:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            type:
                              type: string
