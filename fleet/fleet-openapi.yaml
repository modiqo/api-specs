  /api/v1/fleet/software/self_service_categories:
    get:
      summary: List self-service categories
      description: Lists all self-service categories on the specified fleet.
      operationId: list_self_service_categories
      tags:
      - Self-service categories
      parameters:
      - name: fleet_id
        in: query
        description: Required. The fleet ID. Use `0` to list categories for "Unassigned" hosts.
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  self_service_categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        fleet_id:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
              example:
                self_service_categories:
                - id: 12
                  name: 🌎 Browsers
                  fleet_id: 3
                  created_at: '2026-05-01T14:22:58Z'
                  updated_at: '2026-05-01T14:22:58Z'
                - id: 13
                  name: 🧰 Developer tools
                  fleet_id: 3
                  created_at: '2026-05-01T14:22:58Z'
                  updated_at: '2026-05-01T14:22:58Z'
    post:
      summary: Add self-service category
      description: Creates a new self-service category on the specified fleet. Only global and fleet admins and
        maintainers can call this endpoint.
      operationId: add_self_service_category
      tags:
      - Self-service categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_id:
                  type: integer
                  description: Required. The fleet ID. Use `0` to add the category to "Unassigned" hosts.
                name:
                  type: string
                  description: Required. The category name. Must be unique within the fleet (case-insensitive) and
                    at most 255 characters. Emojis are supported and are part of the name (e.g. `"🌎 Browsers"`).
              required:
              - fleet_id
              - name
            example:
              fleet_id: 3
              name: 💼 Engineering
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  self_service_category:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      fleet_id:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
              example:
                self_service_category:
                  id: 42
                  name: 💼 Engineering
                  fleet_id: 3
                  created_at: '2026-05-12T18:45:00Z'
                  updated_at: '2026-05-12T18:45:00Z'
  /api/v1/fleet/software/self_service_categories/{id}:
    patch:
      summary: Update self-service category
