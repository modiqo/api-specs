  /api/v1/fleet/users:
    get:
      summary: List users
      description: Returns a list of all enabled users
      operationId: list_users
      tags:
      - Users
      parameters:
      - name: query
        in: query
        description: Search query keywords. Searchable fields include `name` and `email`.
        schema:
          type: string
      - name: order_key
        in: query
        description: What to order results by. Can be any column in the users table.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. Filters the users to only include users in the specified fleet.
        schema:
          type: integer
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        id:
                          type: integer
                        name:
                          type: string
                        email:
                          type: string
                        force_password_reset:
                          type: boolean
                        gravatar_url:
                          type: string
                        sso_enabled:
                          type: boolean
                        mfa_enabled:
                          type: boolean
                        global_role:
                          nullable: true
                        api_only:
                          type: boolean
                        fleets:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              created_at:
                                type: string
                              name:
                                type: string
                              description:
                                type: string
                              role:
                                type: string
              example:
                users:
                - created_at: '2020-12-10T03:52:53Z'
                  updated_at: '2020-12-10T03:52:53Z'
                  id: 1
                  name: Jane Doe
                  email: janedoe@example.com
                  force_password_reset: false
                  gravatar_url: ''
                  sso_enabled: false
                  mfa_enabled: false
                  global_role: null
                  api_only: false
                  fleets:
                  - id: 1
                    created_at: '0001-01-01T00:00:00Z'
                    name: workstations
                    description: ''
                    role: admin
    post:
      summary: Create user from invite
      description: Creates a user account after an invited user provides registration information and submits the
        form.
      operationId: create_user_from_invite
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Required. The email address of the user.
                invite_token:
                  type: string
                  description: Required. Token provided to the user in the invitation email.
                name:
                  type: string
                  description: Required. The name of the user.
                password:
                  type: string
                  description: The password chosen by the user (if not SSO user).
                password_confirmation:
                  type: string
                  description: Confirmation of the password chosen by the user.
              required:
              - email
              - invite_token
              - name
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      enabled:
                        type: boolean
                      force_password_reset:
                        type: boolean
                      gravatar_url:
                        type: string
                      sso_enabled:
                        type: boolean
                      mfa_enabled:
                        type: boolean
                      global_role:
                        type: string
                      fleets:
                        type: array
                        items: {}
              example:
                user:
                  created_at: '0001-01-01T00:00:00Z'
                  updated_at: '0001-01-01T00:00:00Z'
                  id: 2
                  name: janedoe
                  email: janedoe@example.com
                  enabled: true
                  force_password_reset: false
                  gravatar_url: ''
                  sso_enabled: false
                  mfa_enabled: false
                  global_role: admin
                  fleets: []
  /api/v1/fleet/users/admin:
    post:
      summary: Create user
      description: Creates a user account without requiring an invitation, the user is enabled immediately. By default,
        the user will be forced to reset its password upon first login.
      operationId: create_user
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Required. The user's email address.
                name:
                  type: string
                  description: Required. The user's full name or nickname.
                password:
                  type: string
                  description: The user's password (required for API only and non-SSO users).
                sso_enabled:
                  type: boolean
                  description: Whether or not SSO is enabled for the user.
                mfa_enabled:
                  type: boolean
                  description: _Available in Fleet Premium._ Whether or not the user must click a magic link emailed
                    to them to log in, after they successfully enter their username and password. Incompatible with
                    SSO and API-only users.
                api_only:
                  type: boolean
                  description: User is an "API-only" user (cannot use web UI) if true.
                global_role:
                  type: string
                  description: The role assigned to the user. If `global_role` is specified, `fleets` cannot be
                    specified. For more information, see manage access.
                admin_forced_password_reset:
                  type: boolean
                  description: Sets whether the user will be forced to reset its password upon first login (default=true)
                fleets:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      role:
                        type: string
                  description: _Available in Fleet Premium_. The fleets and respective roles assigned to the user.
                    Should contain an array of objects in which each object includes the fleet's `id` and the user's
                    `role` on each fleet. If `fleets` is specified, `global_role` cannot be specified. For more
                    information, see manage access.
              required:
              - email
              - name
            example:
              name: Jane Doe
              email: janedoe@example.com
              password: test-123
              api_only: true
              fleets:
              - id: 2
                role: observer
              - id: 3
                role: maintainer
