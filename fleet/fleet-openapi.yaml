  /api/v1/fleet/hosts/{id}/reports:
    get:
      summary: List host's reports
      description: Lists the saved reports that run on a host, along with the first result for each report that
        saves results.
      operationId: list_host_s_reports
      tags:
      - Reports
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's ID.
        schema:
          type: integer
      - name: query
        in: query
        description: Search query keywords. Searchable fields include `name`.
        schema:
          type: string
      - name: exclude_no_results
        in: query
        description: If `true`, exclude reports that don't save results. Default is `false`.
        schema:
          type: boolean
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Valid options are `"name"` and `"last_fetched"`. Default is `"name"`.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        query:
                          type: string
                        logging:
                          type: string
                        discard_data:
                          type: boolean
                        total_results_count:
                          type: integer
                        last_fetched:
                          type: string
                        first_result_columns:
                          type: object
                          properties:
                            model:
                              type: string
                            vendor:
                              type: string
                            name:
                              type: string
                            version:
                              type: string
                            major:
                              type: string
                            minor:
                              type: string
                            patch:
                              type: string
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
                  count:
                    type: integer
              example:
                reports:
                - id: 31
                  name: List USB devices
                  description: Retrieves USB devices and their details.
                  query: SELECT model, vendor FROM usb_devices;
                  logging: snapshot
                  discard_data: false
                  total_results_count: 4
                  last_fetched: '2021-01-19T17:08:31Z'
                  first_result_columns:
                    model: USB 2.0 Hub
                    vendor: VIA Labs, Inc.
                - id: 44
                  name: Get operating system version
