  /api/v1/fleet/hosts/{id}/health:
    get:
      summary: Get host's device health report
      description: Retrieves information about a single host's device health. This report includes a subset of host
        vitals, and simplified policy and vulnerable software information. Data is cached to preserve performance.
        To get all up-to-date information about a host, use the "Get host" endpoint.
      operationId: get_host_s_device_health_report
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's `id`.
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  host_id:
                    type: integer
                  health:
                    type: object
                    properties:
                      updated_at:
                        type: string
                      os_version:
                        type: string
                      disk_encryption_enabled:
                        type: boolean
                      failing_policies_count:
                        type: integer
                      failing_critical_policies_count:
                        type: integer
                      failing_policies:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            critical:
                              type: boolean
                            resolution:
                              type: string
                      vulnerable_software:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            version:
                              type: string
              example:
                host_id: 1
                health:
                  updated_at: '2023-09-16T18:52:19Z'
                  os_version: CentOS Linux 8.3.2011
                  disk_encryption_enabled: true
                  failing_policies_count: 1
                  failing_critical_policies_count: 1
                  failing_policies:
                  - id: 123
                    name: Google Chrome is up to date
                    critical: true
                    resolution: 'Follow the Update Google Chrome instructions here: https://support.google.com/chrome/answer/95414?sjid=6534253818042437614-NA'
                  vulnerable_software:
                  - id: 321
                    name: Firefox.app
                    version: 116.0.3
  /api/v1/fleet/hosts/{id}/device_url:
    get:
      summary: Get host's device page URL
      description: Retrieves the end user url for the host's My device page.
      operationId: get_host_s_device_page_url
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's `id`.
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  host_id:
                    type: integer
                  device_url:
                    type: string
              example:
                host_id: 1
                device_url: example.com/device/device_id
  /api/v1/fleet/hosts/summary/mdm:
    get:
      summary: Get mobile device management (MDM) status
      description: Currently supports Windows and macOS. Retrieves MDM enrollment summary. Windows servers are excluded
        from the aggregated data.
      operationId: get_mobile_device_management_mdm_status
      tags:
      - Hosts
      parameters:
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. Filter by fleet.
        schema:
          type: integer
      - name: platform
        in: query
        description: Filter by platform ("windows" or "darwin")
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts_updated_at:
                    type: string
                  mobile_device_management_enrollment_status:
                    type: object
                    properties:
                      enrolled_manual_hosts_count:
                        type: integer
                      enrolled_automated_hosts_count:
                        type: integer
                      enrolled_personal_hosts_count:
                        type: integer
                      unenrolled_hosts_count:
                        type: integer
                      hosts_count:
                        type: integer
                  mobile_device_management_solution:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        server_url:
                          type: string
                        hosts_count:
                          type: integer
              example:
                counts_updated_at: '2021-03-21T12:32:44Z'
                mobile_device_management_enrollment_status:
                  enrolled_manual_hosts_count: 10
                  enrolled_automated_hosts_count: 200
                  enrolled_personal_hosts_count: 30
                  unenrolled_hosts_count: 0
                  hosts_count: 240
                mobile_device_management_solution:
                - id: 2
                  name: Solution1
                  server_url: solution1.com
                  hosts_count: 1
                - id: 3
                  name: Solution2
                  server_url: solution2.com
                  hosts_count: 1
  /api/v1/fleet/hosts/{id}/macadmins:
    get:
      summary: Get host's mobile device management (MDM) and Munki information
      description: Retrieves a host's MDM enrollment status, MDM server URL, and Munki version.
      operationId: get_host_s_mobile_device_management_mdm_and_munki_information
      tags:
      - Hosts
