      operationId: get_software_install_result
      tags:
      - Software
      x-fleet-premium: true
      parameters:
      - name: install_uuid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  install_uuid:
                    type: string
                  software_title:
                    type: string
                  software_title_id:
                    type: integer
                  software_package:
                    type: string
                  host_id:
                    type: integer
                  host_display_name:
                    type: string
                  status:
                    type: string
