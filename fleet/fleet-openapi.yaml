        as of Fleet 4.41. It is maintained for backwards compatibility. Please use the below API endpoint instead.
        Add a configuration profile to enforce custom settings on macOS and Windows hosts. > You need to send a
        request of type `multipart/form-data`. > This endpoint accepts a maximum request body size of 1.5MiB.'
      operationId: create_configuration_profile
      tags:
      - OS settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile:
                  type: string
                  description: Required. The .mobileconfig and JSON for macOS or XML for Windows file containing
                    the profile.
                fleet_id:
                  type: string
                  description: _Available in Fleet Premium_. The fleet ID for the profile. If specified, the profile
                    is applied to only hosts that are assigned to the specified fleet. If not specified, the profile
                    is applied to only hosts that are "Unassigned".
                labels_include_all:
                  type: array
                  items: {}
                  description: _Available in Fleet Premium_. Target hosts that have all labels, specified by label
                    name, in the array.
                labels_include_any:
                  type: array
                  items: {}
                  description: _Available in Fleet Premium_. Target hosts that have any label, specified by label
                    name, in the array.
                labels_exclude_any:
                  type: array
                  items: {}
                  description: _Available in Fleet Premium_. Target hosts that that don’t have any label, specified
                    by label name, in the array.
              required:
              - profile
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile_uuid:
                    type: string
              example:
                profile_uuid: 954ec5ea-a334-4825-87b3-937e7e381f24
    get:
      summary: List configuration profiles
      description: '> List custom macOS settings (`GET /api/v1/fleet/mdm/apple/profiles`) API endpoint is deprecated
        as of Fleet 4.41. It is maintained for backwards compatibility. Please use the below API endpoint instead.
        Get a list of the configuration profiles in Fleet. For Fleet Premium, the list can optionally be filtered
        by fleet ID. If no fleet ID is specified, fleet profiles are excluded from the results (i.e., only profiles
        that are associated with "Unassigned" are listed).'
      operationId: list_configuration_profiles
      tags:
      - OS settings
      x-fleet-premium: true
      parameters:
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. The fleet id to filter profiles.
        schema:
          type: string
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Can be ordered by `name`, `created_at`, or `uploaded_at`.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      type: object
                      properties:
                        profile_uuid:
                          type: string
                        team_id:
                          type: integer
                        name:
                          type: string
                        platform:
                          type: string
                        identifier:
                          type: string
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        checksum:
                          type: string
                        labels_exclude_any:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              id:
                                type: integer
                        labels_include_all:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              broken:
                                type: boolean
                              id:
                                type: integer
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
              example:
                profiles:
                - profile_uuid: 39f6cbbc-fe7b-4adc-b7a9-542d1af89c63
                  team_id: 0
                  name: Example macOS profile
                  platform: darwin
                  identifier: com.example.profile
                  created_at: '2023-03-31T00:00:00Z'
                  updated_at: '2023-03-31T00:00:00Z'
                  checksum: dGVzdAo=
                  labels_exclude_any:
                  - name: Label name 1
                    id: 1
                - profile_uuid: f5ad01cc-f416-4b5f-88f3-a26da3b56a19
                  team_id: 0
                  name: Example Windows profile
                  platform: windows
                  created_at: '2023-04-31T00:00:00Z'
                  updated_at: '2023-04-31T00:00:00Z'
                  checksum: aCLemVr)
                  labels_include_all:
                  - name: Label name 2
                    broken: true
                  - name: Label name 3
                    id: 3
                meta:
                  has_next_results: false
                  has_previous_results: false
