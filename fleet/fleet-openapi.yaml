  /api/v1/fleet/charts/{metric}:
    get:
      summary: Get chart data
      description: 'Returns time-series data for a dashboard chart, as a list of per-bucket distinct host counts
        over a recent window. The available metrics are: - `uptime`: the number of hosts online (checking in to
        Fleet) during each bucket. - `cve`: _Available in Fleet Premium_. The number of hosts with critical (CVSS
        >= 9.0) vulnerabilities in tracked software during each bucket.'
      operationId: get_chart_data
      tags:
      - Charts
      x-fleet-premium: true
      parameters:
      - name: metric
        in: path
        required: true
        description: Required. The chart metric. One of `uptime` or `cve`. The `cve` metric requires Fleet Premium.
        schema:
          type: string
      - name: days
        in: query
        description: Number of days of history to return. Must be between 1 and 31. Default is `7`.
        schema:
          type: integer
      - name: resolution
        in: query
        description: Bucket size in hours. Must be `0` or a positive divisor of 24 (for example `1`, `2`, `3`, `4`,
          `6`, `8`, `12`, `24`). `0` (the default) uses the metric's default resolution.
        schema:
          type: integer
      - name: tz_offset
        in: query
        description: The client's UTC offset in minutes, as returned by JavaScript's `Date.getTimezoneOffset()`
          (positive is west of UTC). Used to align bucket boundaries to the client's local time.
        schema:
          type: integer
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. Scopes results to the specified fleet. Use `0` to scope to "Unassigned"
          (no fleet) hosts.
        schema:
          type: integer
      - name: label_ids
        in: query
        description: Comma-separated list of label IDs. Limits the chart to hosts that belong to any of these labels.
        schema:
          type: string
      - name: platforms
        in: query
        description: Comma-separated list of host platforms to include (for example `darwin,windows,linux,chrome`).
        schema:
          type: string
      - name: include_host_ids
        in: query
        description: Comma-separated list of host IDs. Limits the chart to only these hosts.
        schema:
          type: string
      - name: exclude_host_ids
        in: query
        description: Comma-separated list of host IDs to exclude from the chart.
        schema:
          type: string
      - name: software_filters
        in: query
        description: '`cve` metric only. Comma-separated list of software categories to include: `os`, `browsers`,
          `office`, `adobe`. Omit to include all categories.'
        schema:
          type: string
      - name: has_known_exploit
        in: query
        description: '`cve` metric only. If `true`, only include CVEs with a known exploit (present in the CISA
          Known Exploited Vulnerabilities catalog).'
        schema:
          type: boolean
      - name: epss_min
        in: query
        description: '`cve` metric only. Minimum EPSS probability, from `0.0` to `1.0`.'
        schema:
          type: number
      - name: epss_max
        in: query
        description: '`cve` metric only. Maximum EPSS probability, from `0.0` to `1.0`.'
        schema:
          type: number
      - name: exclude_vulnerabilities
        in: query
        description: '`cve` metric only. Comma-separated list of CVEs (for example `CVE-2024-1234`) to exclude from
          the chart.'
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  metric:
                    type: string
                  visualization:
                    type: string
                  total_hosts:
                    type: integer
                  resolution:
                    type: string
                  days:
                    type: integer
                  filters:
                    type: object
                    properties:
                      software_filters:
                        type: array
                        items:
                          type: string
                      has_known_exploit:
                        type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                        value:
                          type: integer
              example:
                metric: cve
                visualization: line
                total_hosts: 1164
                resolution: 3-hour
                days: 7
                filters:
                  software_filters:
                  - browsers
                  - adobe
                  has_known_exploit: true
                data:
                - timestamp: '2026-06-08T00:00:00Z'
                  value: 488
                - timestamp: '2026-06-08T03:00:00Z'
                  value: 502
