  /api/v1/fleet/invites:
    post:
      summary: Invite user
      operationId: invite_user
      tags:
      - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                global_role:
                  type: string
                  description: Role the user will be granted. Either a global role is needed, or a fleet role.
                email:
                  type: string
                  description: Required. The email of the invited user. This email will receive the invitation link.
                name:
                  type: string
                  description: Required. The name of the invited user.
                sso_enabled:
                  type: boolean
                  description: Required. Whether or not SSO will be enabled for the invited user.
                mfa_enabled:
                  type: boolean
                  description: _Available in Fleet Premium._ Whether or not the invited user must click a magic
                    link emailed to them to log in, after they successfully enter their username and password. Users
                    can have SSO or MFA enabled, but not both.
                fleets:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      role:
                        type: string
                  description: _Available in Fleet Premium_. A list of the fleets the user is a member of. Each
                    item includes the fleet's ID and the user's role in the specified fleet.
              required:
              - email
              - name
              - sso_enabled
            example:
              email: john_appleseed@example.com
              name: John
              sso_enabled: false
              mfa_enabled: false
              global_role: null
              fleets:
              - id: 2
                role: observer
