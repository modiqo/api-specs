        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      - name: status
        in: query
        description: Indicates the status of the hosts to return. Can either be 'new', 'online', 'offline', 'mia'
          or 'missing'.
        schema:
          type: string
      - name: query
        in: query
        description: Search query keywords. Searchable fields include `hostname`, `hardware_serial`, `uuid`, and
          `ipv4`.
        schema:
          type: string
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. Filters the hosts to only include hosts in the specified fleet.
        schema:
          type: integer
      - name: disable_failing_policies
        in: query
        description: If "true", hosts will return failing policies as 0 regardless of whether there are any that
          failed for the host. This is meant to be used when increased performance is needed in exchange for the
          extra information.
        schema:
          type: boolean
      - name: mdm_id
        in: query
        description: The ID of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter
          hosts that use a specific MDM provider and URL).
        schema:
          type: integer
      - name: mdm_name
        in: query
        description: The name of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter
          hosts that use a specific MDM provider).
        schema:
          type: string
      - name: mdm_enrollment_status
        in: query
        description: The _mobile device management_ (MDM) enrollment status to filter hosts by. Valid options are
          'manual', 'manual-personal', 'automatic', 'enrolled', 'pending', or 'unenrolled'. 'pending' only includes
          Apple (macOS, iOS, iPadOS) hosts in Apple Business (AB) that are not yet enrolled to Fleet.
        schema:
          type: string
      - name: macos_settings
        in: query
        description: 'Filters the hosts by the status of the _mobile device management_ (MDM) profiles applied to
          hosts. Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''. Note: If this filter
          is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.'
        schema:
          type: string
      - name: low_disk_space
        in: query
        description: _Available in Fleet Premium_. Filters the hosts to only include hosts with less GB of disk
          space available than this value. Must be a number between 1-100.
        schema:
          type: integer
      - name: macos_settings_disk_encryption
        in: query
        description: Filters the hosts by disk encryption status. Valid options are 'verified', 'verifying', 'action_required',
          'enforcing', 'failed', or 'removing_enforcement'.
        schema:
          type: string
      - name: bootstrap_package
        in: query
        description: '_Available in Fleet Premium_. Filters the hosts by the status of the MDM bootstrap package
          on the host. Valid options are ''installed'', ''pending'', or ''failed''. Note: If this filter is used
          in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.'
        schema:
          type: string
      - name: os_settings
        in: query
        description: 'Filters the hosts by the status of the operating system settings applied to the hosts. Valid
          options are ''verified'', ''verifying'', ''pending'', or ''failed''. Note: If this filter is used in Fleet
          Premium without a fleet ID filter, the results include only "Unassigned" hosts.'
        schema:
