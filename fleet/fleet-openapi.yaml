                    failed: 2
  /api/v1/fleet/software/fleet_maintained_apps:
    get:
      summary: List Fleet-maintained apps
      description: List available Fleet-maintained apps.
      operationId: list_fleet_maintained_apps
      tags:
      - Software
      parameters:
      - name: fleet_id
        in: query
        description: If specified, each app includes the `software_title_id` if the software has already been added
          to that fleet.
        schema:
          type: integer
      - name: query
        in: query
        description: Search query keywords. Searches app name.
        schema:
          type: string
      - name: order_key
        in: query
        description: What to order results by. Currently only `name` is supported.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order. Options are `"asc"` and `"desc"`. Default
          is `"asc"`.
        schema:
          type: string
      - name: page
        in: query
        description: 'Page number of the results to fetch. Pagination is by app: an app''s macOS and Windows entries
          are counted as one result and always returned on the same page.'
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results (apps) per page.
        schema:
          type: integer
      - name: platform
        in: query
        description: Filter to apps available on a platform. Options are `"darwin"` (macOS) and `"windows"`.
        schema:
          type: string
      - name: available
        in: query
        description: If `true`, only return apps that have not yet been added to the fleet. Requires `fleet_id`.
        schema:
          type: boolean
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  fleet_maintained_apps:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        slug:
                          type: string
                        platform:
                          type: string
                        version:
                          type: string
                        software_title_id:
                          type: integer
                  count:
                    type: integer
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
              example:
                fleet_maintained_apps:
                - id: 1
                  name: 1Password
                  slug: 1password/darwin
                  platform: darwin
                  version: 8.10.40
                  software_title_id: 1
                - id: 2
                  name: Adobe Acrobat Reader
                  slug: adobe-acrobat-reader/darwin
                  platform: darwin
                  version: 24.002.21005
                  software_title_id: null
                - id: 3
                  name: Box Drive
                  slug: box-drive/darwin
                  platform: darwin
                  version: 2.39.179
                  software_title_id: 3
                count: 250
                meta:
                  has_next_results: false
                  has_previous_results: false
    post:
      summary: Add Fleet-maintained app
      description: _Available in Fleet Premium._ Add Fleet-maintained app so it's available for install.
      operationId: add_fleet_maintained_app
      tags:
      - Software
      x-fleet-premium: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_maintained_app_id:
                  type: integer
                  description: Required. The ID of Fleet-maintained app.
                fleet_id:
                  type: integer
                  description: Required. The fleet ID. Adds Fleet-maintained app to the specified fleet.
                install_script:
                  type: string
                  description: Command that Fleet runs to install software. If not specified Fleet runs default
                    install command for each Fleet-maintained app.
                pre_install_query:
                  type: string
                  description: Query that is pre-install condition. If the query doesn't return any result, Fleet
                    won't proceed to install.
                post_install_script:
                  type: string
                  description: The contents of the script to run after install. If the specified script fails (exit
                    code non-zero) software install will be marked as failed and rolled back.
                self_service:
                  type: boolean
                  description: Self-service software is optional and can be installed by the end user.
                labels_include_all:
                  type: array
                  items: {}
                  description: Target hosts that have all labels, specified by label name, in the array.
                team_id:
                  type: integer
                automatic_install:
                  type: boolean
              required:
              - fleet_maintained_app_id
              - fleet_id
            example:
              fleet_maintained_app_id: 3
              team_id: 2
              automatic_install: true
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  software_title_id:
                    type: integer
              example:
                software_title_id: 234
  /api/v1/fleet/software/fleet_maintained_apps/{id}:
    get:
      summary: Get Fleet-maintained app
      description: Returns information about the specified Fleet-maintained app.
      operationId: get_fleet_maintained_app
      tags:
      - Software
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The Fleet-maintained app's ID.
        schema:
          type: integer
      - name: fleet_id
        in: query
        description: If supplied, set `software_title_id` on the response when an installer or VPP app has already
          been added to that fleet for that software.
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  fleet_maintained_app:
                    type: object
                    properties:
                      id:
                        type: integer
                      slug:
                        type: string
                      name:
                        type: string
                      filename:
                        type: string
                      version:
                        type: string
                      platform:
                        type: string
                      url:
                        type: string
                      install_script:
                        type: string
                      uninstall_script:
                        type: string
                      software_title_id:
                        type: integer
                      categories:
                        type: array
                        items:
                          type: string
              example:
                fleet_maintained_app:
                  id: 1
                  slug: 1password/darwin
                  name: 1Password
                  filename: 1Password-8.10.50-aarch64.zip
                  version: 8.10.50
                  platform: darwin
                  url: https://downloads.1password.com/mac/1Password-8.10.50-aarch64.zip
                  install_script: '#!/bin/sh

                    installer -pkg "$INSTALLER_PATH" -target /'
                  uninstall_script: '#!/bin/sh

                    pkg_ids=$PACKAGE_ID

                    for pkg_id in ''${pkg_ids[@]}'''
                  software_title_id: 3
                  categories:
                  - Productivity
  /api/v1/fleet/software/web_apps:
    post:
      summary: Create Android web app
      description: _Available in Fleet Premium._ Creates web app (web clip). This endpoint returns the application
        ID that can be used to add an Android app to Fleet. > You need to send a request of type `multipart/form-data`.
      operationId: create_android_web_app
      tags:
      - Software
      x-fleet-premium: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Required. It is displayed to the end user under the app icon.
                url:
                  type: string
                  description: Required. The URL of the web app. What the end user sees when they open this app.
                icon:
                  type: string
                  description: The app icon. The icon must be a PNG file and square, with dimensions of at least
                    512 x 512px.
              required:
              - title
              - url
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_store_id:
                    type: string
              example:
                app_store_id: com.google.enterprise.webapp.x1c41e22ab611cb98
  /api/v1/fleet/hosts/{id}/software/{software_title_id}/install:
    post:
      summary: Install software
      description: _Available in Fleet Premium._ Install software (package or app store app) on a macOS, iOS, iPadOS,
        Windows, or Linux (Ubuntu) host. Software title must have a `software_package` or `app_store_app` to be
        installed. Package installs time out after 1 hour.
      operationId: install_software
      tags:
      - Software
      x-fleet-premium: true
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's ID.
        schema:
          type: integer
      - name: software_title_id
        in: path
        required: true
        description: Required. The software title's ID.
        schema:
          type: integer
      responses:
        '202':
          description: Default response
  /api/v1/fleet/hosts/{id}/software/{software_title_id}/uninstall:
    post:
      summary: Uninstall software
      description: _Available in Fleet Premium._ Uninstalls software from a host.
      operationId: uninstall_software
      tags:
      - Software
      x-fleet-premium: true
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's ID.
        schema:
          type: integer
      - name: software_title_id
        in: path
        required: true
        description: Required. The software title's ID.
        schema:
          type: integer
      responses:
        '202':
          description: Default response
  /api/v1/fleet/software/install/{install_uuid}/results:
    get:
      summary: Get software install result
