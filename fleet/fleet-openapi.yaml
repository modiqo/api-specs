  /api/v1/fleet/setup_experience:
    patch:
      summary: Update setup experience
      description: _Available in Fleet Premium_
      operationId: update_setup_experience
      tags:
      - Setup experience
      x-fleet-premium: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_id:
                  type: integer
                  description: The fleet ID to apply the settings to. Settings are applied to "Unassigned" hosts
                    if absent.
                enable_end_user_authentication:
                  type: boolean
                  description: When enabled, require end users to authenticate with your identity provider (IdP)
                    when they set up their new macOS hosts.
                lock_end_user_info:
                  type: boolean
                  description: 'When enabled, end user can''t edit the local account''s Account Name and Full Name
                    in macOS Setup Assistant. These fields will be locked to values from your IdP. (Default: `true`)'
                require_all_software_macos:
                  type: boolean
                  description: If set to `true`, setup will be canceled on macOS hosts if any software installs
                    fail.
                require_all_software_windows:
                  type: boolean
                  description: If set to `true`, setup will be canceled on Windows hosts if any software installs
                    fail (the host is blocked at the Windows Enrollment Status Page until the device is reset).
                    If `false`, the Enrollment Status Page lists the failed software and the end user can continue
                    to the desktop and install it later via self-service.
                enable_release_device_manually:
                  type: boolean
                  description: When enabled, you're responsible for sending the `DeviceConfigured` command. End
                    users will be stuck in Setup Assistant until this command is sent.
                manual_agent_install:
                  type: boolean
                  description: 'If set to `true` Fleet''s agent (fleetd) won''t be installed as part of automatic
                    enrollment (ADE) on macOS hosts. (Default: `false`)'
                team_id:
                  type: integer
            example:
              team_id: 1
              fleet_id: 1
              enable_end_user_authentication: true
              enable_release_device_manually: true
      responses:
        '204':
          description: Default response
