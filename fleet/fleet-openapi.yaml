  /api/v1/fleet/configuration_profiles/batch:
    post:
      summary: Batch-update configuration profiles
      description: Modify configuration profiles for a fleet. The provided list of profiles will be the active profiles
        for the specified fleet. If no fleet (`fleet_id` or `fleet_name`) is provided, the profiles are applied
        for all hosts (Fleet Free) or for hosts that are "Unassigned" (Fleet Premium). For Apple (macOS, iOS, iPadOS)
        profiles, Fleet will send only an `InstallProfile` command (edit) for all existing profiles with the same
        `PayloadIdentifier` (specified in the .mobileconfig file). Fleet will send a `RemoveProfile` command to
        hosts for all existing profiles that are not part of the list. For Windows profiles, Fleet applies new profiles
        or updates when content changes, and deletes profiles no longer in the list. It does not send commands to
        remove configuration profiles from Windows hosts. For declaration (DDM) profiles, hosts with new, updated,
        or removed profiles are marked “Pending,” and Fleet sends a DeclarativeManagement command to tell Apple
        (macOS, iOS, iPadOS) hosts to sync profiles. If declarations are current, no command is sent and the host
        is not marked "Pending." For requests with 100+ profiles, requests will take 5+ seconds. > This endpoint
        accepts a maximum request body size of 25MiB.
      operationId: batch_update_configuration_profiles
      tags:
      - OS settings
      x-fleet-premium: true
      parameters:
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_ The fleet ID to apply the configuration profiles to. Only one
          of `fleet_name` or `fleet_id` may be included in the request.
        schema:
          type: number
      - name: fleet_name
        in: query
        description: _Available in Fleet Premium_ The name of the fleet to apply the custom settings to. Only one
          of `fleet_name` or `fleet_id` may be included in the request.
        schema:
          type: string
      - name: dry_run
        in: query
        description: Validate the provided profiles and return any validation errors, but do not apply the changes.
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                configuration_profiles:
                  type: object
                  description: Required. See configuration_profiles
              required:
              - configuration_profiles
            example:
              configuration_profiles:
              - profile: 
                labels_include_any:
                - Apple Silicon macOS hosts
      responses:
        '200':
          description: OK
