                runtime: 20
                created_at: '2024-09-11T20:30:24Z'
  /api/v1/fleet/scripts/run/batch:
    post:
      summary: Batch-run script
      description: Run a script on multiple hosts. The script will be added to each host's list of upcoming activities.
      operationId: batch_run_script
      tags:
      - Scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                script_id:
                  type: integer
                  description: Required. The ID of the existing saved script to run.
                host_ids:
                  type: array
                  items:
                    type: integer
                  description: List of host IDs. Required if `filters` not specified. Only one of `host_ids` or
                    `filters` may be included in the request.
                filters:
                  type: object
                  description: See filters. Required if `host_ids` not specified. Only one of `host_ids` or `filters`
                    may be included in the request.
                not_before:
                  type: string
                  description: UTC time when the script run is scheduled to begin. If omitted, the batch script
                    will begin right away.
              required:
              - script_id
            example:
              script_id: 123
              host_ids:
              - 1
              - 2
              - 3
              not_before: '2025-07-01T15:00:00Z'
      responses:
        '202':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_execution_id:
                    type: string
              example:
                batch_execution_id: e797d6c6-3aae-11ee-be56-0242ac120002
