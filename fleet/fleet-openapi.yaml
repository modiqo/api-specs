                    name: Could not retrieve managed install primary manifest
                    type: error
                    hosts_count: 2851
                  - id: 2
                    name: 'Could not process item Figma for optional install. No pkginfo found in catalogs: release'
                    type: warning
                    hosts_count: 1983
                  mobile_device_management_enrollment_status:
                    enrolled_manual_hosts_count: 124
                    enrolled_automated_hosts_count: 124
                    unenrolled_hosts_count: 112
                  mobile_device_management_solution:
                  - id: 1
                    name: SimpleMDM
                    hosts_count: 8360
                    server_url: https://a.simplemdm.com/mdm
                  - id: 2
                    name: Intune
                    hosts_count: 1700
                    server_url: https://enrollment.manage.microsoft.com
  /api/v1/fleet/hosts/{id}/software:
    get:
      summary: Get host's software
      operationId: get_host_s_software
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's ID.
        schema:
          type: integer
      - name: query
        in: query
        description: Search query keywords. Searchable fields include `name`.
        schema:
          type: string
      - name: available_for_install
        in: query
        description: If `true` or `1`, only list software that is available for install (added by the user). Default
          is `false`.
        schema:
          type: boolean
      - name: self_service
        in: query
        description: If `true` or `1`, only lists self-service software. Default is `false`.
        schema:
          type: boolean
      - name: vulnerable
        in: query
        description: If `true` or `1`, only list software that have vulnerabilities. Default is `false`.
        schema:
          type: boolean
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Options include `"name"`. Default is `"name"`.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: min_cvss_score
        in: query
        description: _Available in Fleet Premium_. Filters to include only software with vulnerabilities that have
          a CVSS version 3.x base score higher than the specified value.
        schema:
          type: integer
      - name: max_cvss_score
        in: query
        description: _Available in Fleet Premium_. Filters to only include software with vulnerabilities that have
          a CVSS version 3.x base score lower than what's specified.
        schema:
          type: integer
      - name: exploit
        in: query
        description: '_Available in Fleet Premium_. If `true`, filters to only include software with vulnerabilities
          that have been actively exploited in the wild (`cisa_known_exploit: true`). Default is `false`.'
        schema:
          type: boolean
      - name: macos_applications
        in: query
        description: If `true`, filters to only include software at the top level of the `/Applications` folder.
          This parameter applies only to macOS hosts, and is ignored for hosts on other platforms. Default is `false`.
        schema:
          type: boolean
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  software:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        icon_url:
                          nullable: true
                        source:
                          type: string
                        extension_for:
                          type: string
                        status:
                          nullable: true
                        installed_versions:
                          type: array
                          items:
                            type: object
                            properties:
                              version:
                                type: string
                              bundle_identifier:
                                type: string
                              vulnerabilities:
                                nullable: true
                              installed_paths:
                                type: array
                                items:
                                  type: string
                              signature_information:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    installed_path:
                                      type: string
                                    team_identifier:
                                      type: string
                                    hash_sha256:
                                      type: string
                                    executable_sha256:
                                      nullable: true
                                    executable_path:
                                      nullable: true
                              last_opened_at:
                                type: string
                        display_name:
                          type: string
                        software_package:
                          type: object
                          properties:
                            name:
                              type: string
                            automatic_install_policies:
                              nullable: true
                            version:
                              type: string
                            platform:
                              type: string
                            self_service:
                              type: boolean
                            last_install:
                              nullable: true
                            last_uninstall:
                              nullable: true
                            package_url:
                              nullable: true
                            categories:
                              type: array
                              items:
                                type: string
                        app_store_app:
                          nullable: true
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
              example:
                count: 1
                software:
                - id: 936
                  name: Google Chrome
                  icon_url: null
                  source: apps
                  extension_for: ''
                  status: null
                  installed_versions:
                  - version: 149.0.7827.54
                    bundle_identifier: com.google.Chrome
                    vulnerabilities: null
                    installed_paths:
                    - /Applications/Google Chrome.app
                    signature_information:
                    - installed_path: /Applications/Google Chrome.app
                      team_identifier: EQHXZ8M8AV
                      hash_sha256: ce484e67c58b18313382e9fe2e225df52fb20b5f
                      executable_sha256: null
                      executable_path: null
                    last_opened_at: '2026-06-04T15:22:36Z'
                  display_name: ''
                  software_package:
                    name: GoogleChrome.pkg
                    automatic_install_policies: null
                    version: 149.0.7827.54
                    platform: darwin
                    self_service: true
                    last_install: null
                    last_uninstall: null
                    package_url: null
                    categories:
                    - Browsers
                  app_store_app: null
                meta:
                  has_next_results: false
                  has_previous_results: false
