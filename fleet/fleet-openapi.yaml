  /api/v1/fleet/reports/{id}/run:
    post:
      summary: Run live report
      description: '> This updated API endpoint replaced `GET /api/v1/fleet/queries/run` in Fleet 4.43.0, for improved
        compatibility with many HTTP clients. The deprecated endpoint is maintained for backwards compatibility.
        Runs a live report against the specified hosts and responds with the results. The live report will stop
        if the request times out. Timeouts happen if targeted hosts haven''t responded after the configured `FLEET_LIVE_QUERY_REST_PERIOD`
        (default 25 seconds) or if the `distributed_interval` agent option (default 10 seconds) is higher than the
        `FLEET_LIVE_QUERY_REST_PERIOD`.'
      operationId: run_live_report
      tags:
      - Reports
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The ID of the saved report to run.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host_ids:
                  type: array
                  items:
                    type: integer
                  description: Required. The IDs of the hosts to target. User must be authorized to target all of
                    these hosts.
              required:
              - host_ids
            example:
              host_ids:
              - 1
              - 4
              - 34
              - 27
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_id:
                    type: integer
                  report_id:
                    type: integer
                  targeted_host_count:
                    type: integer
                  responded_host_count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        host_id:
                          type: integer
                        rows:
                          type: array
                          items:
                            type: object
                            properties:
                              build_distro:
                                type: string
                              build_platform:
                                type: string
                              config_hash:
                                type: string
                              config_valid:
                                type: string
                              extensions:
                                type: string
                              instance_id:
                                type: string
                              pid:
                                type: string
                              platform_mask:
                                type: string
                              start_time:
                                type: string
                              uuid:
                                type: string
                              version:
