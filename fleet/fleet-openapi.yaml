      summary: Get database information
      description: 'Returns information about the current state of the database; valid keys are: - `locks`: returns
        transaction locking information. - `innodb-status`: returns InnoDB status information. - `process-list`:
        returns running processes (queries, etc).'
      operationId: get_database_information
      tags:
      - Debug
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /debug/pprof/{key}:
    get:
      summary: Get profiling information
      description: 'Returns runtime profiling data of the server in the format expected by `go tools pprof`. The
        responses are equivalent to those returned by the Go `http/pprof` package. Valid keys are: `cmdline`, `profile`,
        `symbol` and `trace`.'
      operationId: get_profiling_information
      tags:
      - Debug
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /debug/trace_sampler:
    get:
      summary: Get trace sampling settings
      description: Returns the current trace sampling settings. Only has effect when tracing is enabled (see logging_tracing_enabled).
        Requires a global admin.
      operationId: get_trace_sampling_settings
      tags:
      - Debug
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  high_volume_ratio:
                    type: number
                  standard_ratio:
                    type: number
                  force_full:
                    type: boolean
                  updated_at:
                    type: string
              example:
                high_volume_ratio: 0.001
                standard_ratio: 0.02
                force_full: false
                updated_at: '2026-06-01T00:00:00Z'
    patch:
      summary: Adjust trace sampling
      description: Updates one or more trace sampling settings at runtime, without restarting the server. Only the
        fields included in the request body are changed. Each Fleet server polls for changes about once a minute,
        so an update applies across all servers within roughly a minute. Requires a global admin.
      operationId: adjust_trace_sampling
      tags:
      - Debug
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                high_volume_ratio:
                  type: number
                  description: Sample rate for high-volume agent routes, between 0 and 1 (inclusive).
                standard_ratio:
                  type: number
                  description: Sample rate for standard admin/read routes, between 0 and 1 (inclusive).
                force_full:
                  type: boolean
                  description: When `true`, sample every route at 100% (except never-sampled infrastructure paths),
                    ignoring the ratios above.
            example:
              force_full: true
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  high_volume_ratio:
                    type: number
                  standard_ratio:
                    type: number
                  force_full:
                    type: boolean
              example:
                high_volume_ratio: 0.001
                standard_ratio: 0.02
                force_full: true
  /api/v1/fleet/custom_variables:
    get:
      summary: List custom variables
      description: Lists all custom variables that can be used in scripts and profiles prefixed with `$FLEET_SECRET_`.
      operationId: list_custom_variables
      tags:
      - Custom variables
      parameters:
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Allowed fields are `name`, `id`, and `updated_at`.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  custom_variables:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
                  count:
                    type: integer
              example:
                custom_variables:
                - id: 123
                  name: SOME_API_TOKEN
                meta:
                  has_next_results: false
                  has_previous_results: false
                count: 1
    post:
      summary: Create custom variable
      description: Creates a custom variable that can be used in scripts and profiles prefixed with `$FLEET_SECRET_`.
      operationId: create_custom_variable
      tags:
      - Custom variables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required. The desired variable name, without the `FLEET_SECRET_` prefix.
                value:
                  type: string
                  description: Required. The value for the custom variable.
              required:
              - name
              - value
            example:
              name: SOME_API_TOKEN
              value: 971ef02b93c74ca9b22b694a9251f1d6
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
              example:
                id: 123
                name: SOME_API_TOKEN
  /api/v1/fleet/custom_variables/{id}:
    delete:
      summary: Delete custom variable
      description: Removes a custom variable from Fleet.
      operationId: delete_custom_variable
      tags:
      - Custom variables
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Default response
