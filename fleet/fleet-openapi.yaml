  /api/v1/fleet/spec/enroll_secret:
    get:
      summary: Get global enroll secrets
      description: Returns the valid global enroll secrets.
      operationId: get_global_enroll_secrets
      tags:
      - Fleet configuration
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  spec:
                    type: object
                    properties:
                      secrets:
                        type: array
                        items:
                          type: object
                          properties:
                            secret:
                              type: string
                            created_at:
                              type: string
              example:
                spec:
                  secrets:
                  - secret: vhPzPOnCMOMoqSrLxKxzSADyqncayacB
                    created_at: '2021-11-12T20:24:57Z'
                  - secret: jZpexWGiXmXaFAKdrdttFHdJBqEnqlVF
                    created_at: '2021-11-12T20:24:57Z'
    post:
      summary: Update global enroll secrets
      description: Replaces all existing global enroll secrets.
      operationId: update_global_enroll_secrets
      tags:
      - Fleet configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                spec:
                  type: object
                  description: Required. Attribute "secrets" must be a list of enroll secrets
                  properties:
                    secrets:
                      type: array
                      items:
                        type: object
                        properties:
                          secret:
                            type: string
              required:
              - spec
            example:
              spec:
                secrets:
                - secret: KuSkYFsHBQVlaFtqOLwoUIWniHhpvEhP
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
  /api/v1/fleet/logo:
    put:
      summary: Update organization logo
      description: Upload a custom logo to display in the top navigation, setup experience window, and MDM migration
        dialog. > You need to send a request of type `multipart/form-data`.
      operationId: update_organization_logo
      tags:
      - Fleet configuration
      parameters:
      - name: mode
        in: query
        description: 'Either `"light"` for the logo displayed in light mode, `"dark" for the logo displayed in dark
          mode`, or "all" to replace both light and dark mode logos. (Default: `"all"`.)'
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  description: The logo image to upload. For best results, use a square logo at least 150px x 150px.
      responses:
        '204':
          description: Default response
    delete:
      summary: Delete organization logo
      description: Delete a custom logo added via Update organization logo. This will revert to using the Fleet
        logo.
      operationId: delete_organization_logo
      tags:
      - Fleet configuration
      parameters:
      - name: mode
        in: query
        description: 'Either `"light"` for the logo displayed in light mode, `"dark" for the logo displayed in dark
          mode`, or "all" to replace both light and dark mode logos. (Default: `"all"`.)'
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  description: The logo image to upload. For best results, use a square logo at least 150px x 150px.
      responses:
        '204':
          description: Default response
  /api/v1/fleet/fleets/{id}/secrets:
    get:
      summary: Get fleet-level enroll secrets
      description: Returns the fleet's enroll secrets.
      operationId: get_fleet_level_enroll_secrets
      tags:
      - Fleet configuration
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        created_at:
                          type: string
                        secret:
                          type: string
                        team_id:
                          type: integer
                        fleet_id:
                          type: integer
              example:
                secrets:
                - created_at: '2021-06-16T22:05:49Z'
                  secret: aFtH2Nq09hrvi73ErlWNQfa7M53D3rPR
                  team_id: 1
                  fleet_id: 1
    patch:
      summary: Update fleet-level enroll secrets
      description: Replaces all existing enroll secrets for a fleet.
      operationId: update_fleet_level_enroll_secrets
      tags:
      - Fleet configuration
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The fleet's id.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secrets:
                  type: array
                  items:
                    type: object
                    properties:
                      secret:
                        type: string
                  description: Required. A list of enroll secrets
              required:
              - secrets
            example:
              secrets:
              - secret: n07v32y53c237734m3n201153c237
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        secret:
                          type: string
                        created_at:
                          type: string
              example:
                secrets:
                - secret: n07v32y53c237734m3n201153c237
                  created_at: '0001-01-01T00:00:00Z'
  /api/v1/fleet/version:
    get:
      summary: Get version
      description: Get version and build information from the Fleet server.
      operationId: get_version
      tags:
      - Fleet configuration
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  branch:
                    type: string
                  revision:
                    type: string
