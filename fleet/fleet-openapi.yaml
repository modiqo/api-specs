  /api/v1/fleet/certificate_authorities/{id}/request_certificate:
    post:
      summary: Request certificate
      description: Requests a certificate from a certificate authority (CA). Currently, this endpoint is only supported
        for Hydrant and custom EST CAs. DigiCert, NDES, and custom SCEP coming soon. By default, the `certificate`
        field in the response is a PEM-encoded PKCS7 envelope (`-----BEGIN PKCS7-----`/`-----END PKCS7-----`). Set
        `return_pem_certificate` to `true` to receive a standard PEM `CERTIFICATE` block instead. As an alternative
        to API token authentication, you can send an HTTP signature in the request header.
      operationId: request_certificate
      tags:
      - Certificates
      parameters:
      - name: id
        in: path
