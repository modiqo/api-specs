      - name: id
        in: path
        required: true
        description: Required The id of the host to get the details for
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  macadmins:
                    type: object
                    properties:
                      munki:
                        type: object
                        properties:
                          version:
                            type: string
                      munki_issues:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            type:
                              type: string
                            created_at:
                              type: string
                      mobile_device_management:
                        type: object
                        properties:
                          enrollment_status:
                            type: string
                          server_url:
                            type: string
                          name:
                            type: string
                          id:
                            type: integer
              example:
                macadmins:
                  munki:
                    version: 1.2.3
                  munki_issues:
                  - id: 1
                    name: Could not retrieve managed install primary manifest
                    type: error
                    created_at: '2022-08-01T05:09:44Z'
                  - id: 2
                    name: 'Could not process item Figma for optional install. No pkginfo found in catalogs: release'
                    type: warning
                    created_at: '2022-08-01T05:09:44Z'
                  mobile_device_management:
                    enrollment_status: On (automatic)
                    server_url: http://some.url/mdm
                    name: MDM Vendor Name
                    id: 999
