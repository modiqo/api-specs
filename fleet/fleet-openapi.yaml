  /api/v1/fleet/carves:
    get:
      summary: List carves
      description: Retrieves a list of the non expired carves. Carve contents remain available for 24 hours after
        the first data is provided from the osquery client.
      operationId: list_carves
      tags:
      - File carving
      parameters:
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Can be any field listed in the `results` array example below.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Valid options are `"asc"`
          or `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      - name: expired
        in: query
        description: 'Include expired carves (default: false)'
        schema:
          type: boolean
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  carves:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        created_at:
                          type: string
                        host_id:
                          type: integer
                        name:
                          type: string
                        block_count:
                          type: integer
                        block_size:
                          type: integer
                        carve_size:
                          type: integer
                        carve_id:
                          type: string
                        request_id:
                          type: string
                        session_id:
                          type: string
                        expired:
                          type: boolean
                        max_block:
                          type: integer
                        error:
                          type: string
              example:
                carves:
                - id: 1
                  created_at: '2021-02-23T22:52:01Z'
                  host_id: 7
                  name: macbook-pro.local-2021-02-23T22:52:01Z-fleet_distributed_query_30
                  block_count: 1
                  block_size: 2000000
                  carve_size: 2048
                  carve_id: c6958b5f-4c10-4dc8-bc10-60aad5b20dc8
                  request_id: fleet_distributed_query_30
                  session_id: 065a1dc3-40ad-441c-afff-80c2ad7dac28
                  expired: false
                  max_block: 0
                - id: 2
                  created_at: '2021-02-23T22:53:03Z'
                  host_id: 7
                  name: macbook-pro.local-2021-02-23T22:53:03Z-fleet_distributed_query_31
                  block_count: 2
                  block_size: 2000000
                  carve_size: 3400704
                  carve_id: 2b9170b9-4e11-4569-a97c-2f18d18bec7a
                  request_id: fleet_distributed_query_31
