      summary: Add label
      description: Add a dynamic or manual label.
      operationId: add_label
      tags:
      - Labels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required. The label's name.
                description:
                  type: string
                  description: The label's description.
                query:
                  type: string
                  description: The query in SQL syntax used to filter the hosts. Only one of either `query` (to
                    create a dynamic label) or `hosts` (to create a manual label) can be included in the request.
                criteria:
                  type: object
                  description: Criteria for adding hosts to a host vitals label. See `criteria` for details.
                hosts:
                  type: array
                  items: {}
                  description: The list of host identifiers (`hardware_serial` or `uuid`). The label will apply
                    to any host with a matching identifier. Only one of either `query` (to create a dynamic label),
                    `hosts` (to create a manual label), or `host_ids` (to create a manual label) can be included
                    in the request.
                host_ids:
                  type: array
                  items: {}
                  description: The list of Fleet host IDs the label will apply to. Only one of either `query` (to
                    create a dynamic label) or `hosts`/`host_ids` (to create a manual label) can be included in
                    the request.
                platform:
                  type: string
                  description: The specific platform for the label to target. Provides an additional filter. Choices
                    for platform are `darwin`, `windows`, `ubuntu`, and `centos`. All platforms are included by
                    default and this option is represented by an empty string.
              required:
              - name
            example:
              name: macOS hosts (x86_64)
              description: Filters macOS hosts with x86_64 architecture
              query: SELECT 1 FROM os_version WHERE platform = 'darwin' AND instr(arch, 'x86_64')
              platform: darwin
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  label:
                    type: object
                    properties:
                      created_at:
