  /api/v1/fleet/setup_experience/software:
    get:
      summary: List setup experience software
      description: _Available in Fleet Premium_ List software that can be automatically installed during setup.
        If `install_during_setup` is `true` it will be installed during setup. On Windows and Linux hosts, Fleet
        checks the software's associated policies first and skips the install when the host passes all of them.
        Learn more in the Windows and Linux setup experience guide.
      operationId: list_setup_experience_software
      tags:
      - Setup experience
      x-fleet-premium: true
      parameters:
      - name: platform
        in: query
        description: Filters software titles available for install by platforms. Options are `"macos"`, `"windows"`,
          `"linux"`, `"ios"`, `"ipados"`, and `"android"`. Defaults to `"macos"`. To show titles from multiple platforms,
          separate the platforms with commas (e.g. `?platform=macos,ios,android`).
        schema:
          type: string
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. The ID of the fleet to filter software by. If not specified,
          it will filter only software that's available for "Unassigned" hosts.
        schema:
          type: integer
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Allowed fields are `name` and `hosts_count`. Default is `hosts_count`
          (descending).
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  software_titles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        icon_url:
                          type: string
                        software_package:
                          type: object
                          properties:
                            name:
                              type: string
                            platform:
                              type: string
                            version:
                              type: string
                            self_service:
                              type: boolean
                            install_during_setup:
                              type: boolean
                        app_store_app:
                          nullable: true
                        versions_count:
                          type: integer
                        source:
                          type: string
                        hosts_count:
                          type: integer
                        versions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              version:
                                type: string
                              vulnerabilities:
                                type: array
                                items:
                                  type: string
                  count:
                    type: integer
                  counts_updated_at:
                    type: string
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
              example:
                software_titles:
                - id: 12
                  name: Firefox.app
                  icon_url: /api/latest/fleet/software/titles/12/icon?fleet_id=3
                  software_package:
                    name: FirefoxInstall.pkg
                    platform: darwin
                    version: '125.6'
                    self_service: true
                    install_during_setup: true
                  app_store_app: null
                  versions_count: 3
                  source: apps
                  hosts_count: 48
                  versions:
                  - id: 123
                    version: '1.12'
                    vulnerabilities:
                    - CVE-2023-1234
                    - CVE-2023-4321
                    - CVE-2023-7654
                  - id: 124
                    version: '3.4'
                    vulnerabilities:
                    - CVE-2023-1234
                    - CVE-2023-4321
                    - CVE-2023-7654
                  - id: 12
                    version: '1.13'
                    vulnerabilities:
                    - CVE-2023-1234
                    - CVE-2023-4321
                    - CVE-2023-7654
                count: 2
                counts_updated_at: '2024-10-04T10:00:00Z'
                meta:
                  has_next_results: false
                  has_previous_results: false
    put:
      summary: Update setup experience software
      description: _Available in Fleet Premium_ Set software that will be automatically installed during setup.
        Software that isn't included in the request will be unset.
      operationId: update_setup_experience_software
      tags:
      - Setup experience
      x-fleet-premium: true
      parameters:
      - name: platform
        in: query
        description: Platform to install software for. Either `"macos"`, `"windows"`, `"linux"`, `"ios"`, `"ipados"`,
          or `"android"`. Defaults to `"macos"`.
        schema:
          type: string
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. The ID of the fleet to set the software for. If not specified,
          it will set the software for "Unassigned" hosts.
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                software_title_ids:
                  type: array
                  items:
                    type: integer
                  description: The ID of software titles to install during setup.
                platform:
                  type: string
                team_id:
                  type: integer
                fleet_id:
                  type: integer
            example:
              platform: linux
              team_id: 1
              fleet_id: 1
              software_title_ids:
              - 3000
              - 3001
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties: {}
              example: {}
