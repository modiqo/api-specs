  /api/v1/fleet/hosts/{id}/lock:
    post:
      summary: Lock host
      description: _Available in Fleet Premium_ Sends a command to lock the specified macOS, iOS, iPadOS, Linux,
        Windows, or Android host. The host is locked once it comes online. To lock a macOS, iOS, or iPadOS host,
        the host must have MDM turned on. To lock a Windows or Linux host, the host must have scripts enabled. For
        iOS and iPadOS, this enables Lost Mode and sends a Device Location MDM command. To see location, use the
        Get host endpoint.
      operationId: lock_host
      tags:
      - Hosts
      x-fleet-premium: true
      parameters:
      - name: id
        in: path
        required: true
        description: Required. ID of the host to be locked.
        schema:
          type: integer
      - name: view_pin
        in: query
        description: For macOS hosts, whether to return the unlock PIN.
        schema:
          type: boolean
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  unlock_pin:
                    type: string
                  device_status:
                    type: string
                  pending_action:
                    type: string
              example:
                unlock_pin: '123456'
                device_status: unlocked
                pending_action: lock
  /api/v1/fleet/hosts/{id}/unlock:
    post:
      summary: Unlock host
      description: _Available in Fleet Premium_ Sends a command to unlock the specified iOS, iPadOS, Windows, or
        Linux host, or retrieves the unlock PIN for a macOS host. To unlock an iOS or iPadOS host, the host must
        have MDM turned on. To unlock a Windows or Linux host, the host must have scripts enabled. For iOS and iPadOS,
        this disables Lost Mode.
      operationId: unlock_host
      tags:
      - Hosts
      x-fleet-premium: true
      parameters:
      - name: id
        in: path
        required: true
        description: Required. ID of the host to be unlocked.
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  host_id:
                    type: integer
                  device_status:
                    type: string
                  pending_action:
                    type: string
              example:
                host_id: 8
                device_status: locked
                pending_action: unlock
  /api/v1/fleet/hosts/{id}/wipe:
    post:
      summary: Wipe host
      description: Sends a command to wipe the specified macOS, iOS, iPadOS, Linux, Windows, or Android host. The
        host is wiped once it comes online. Wiping an Android host is available in Fleet Free and Fleet Premium.
        Wiping a macOS, iOS, iPadOS, Linux, or Windows host is available in Fleet Premium. To wipe a macOS, iOS,
        iPadOS, or Windows host, the host must have MDM turned on. To wipe a Linux host, the host must have scripts
        enabled. To wipe an Android host, the host must be enrolled as a fully managed device.
      operationId: wipe_host
      tags:
      - Hosts
      x-fleet-premium: true
      parameters:
      - name: id
        in: path
        required: true
        description: Required. ID of the host to be wiped.
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                windows:
                  type: object
                  description: Optional metadata used when wiping Windows hosts. The object includes a `wipe_type`
                    property that can be used for specifying what type of remote wipe to perform. Allowed values
                    are `"doWipe"` and `"doWipeProtected"`.
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_status:
                    type: string
                  pending_action:
                    type: string
              example:
                device_status: unlocked
                pending_action: wipe
