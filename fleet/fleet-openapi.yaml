  /api/v1/fleet/hosts/{id}/query:
    post:
      summary: Run live report on host (ad hoc)
      description: Runs an ad hoc live report against the specified host and responds with the results. The live
        report will stop if the targeted host is offline, or if the query times out. Timeouts happen if the host
        hasn't responded after the configured `FLEET_LIVE_QUERY_REST_PERIOD` (default 25 seconds) or if the `distributed_interval`
        agent option (default 10 seconds) is higher than the `FLEET_LIVE_QUERY_REST_PERIOD`.
      operationId: run_live_report_on_host_ad_hoc
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The target host ID.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: Required. The query SQL.
              required:
              - query
            example:
              query: SELECT model, vendor FROM usb_devices;
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  host_id:
                    type: integer
                  query:
                    type: string
                  status:
                    type: string
                  error:
                    nullable: true
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        model:
                          type: string
                        vendor:
                          type: string
              example:
                host_id: 123
                query: SELECT model, vendor FROM usb_devices;
                status: online
                error: null
                rows:
                - model: USB2.0 Hub
                  vendor: VIA Labs, Inc.
