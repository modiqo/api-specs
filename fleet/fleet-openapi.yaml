  /api/v1/fleet/scripts/run:
    post:
      summary: Run script
      description: Run a script on a host. The script will be added to the host's list of upcoming activities. The
        new script will run after other activities finish. Failure of one activity won't cancel other activities.
        By default, script runs time out after 5 minutes. You can modify this default in your agent configuration.
      operationId: run_script
      tags:
      - Scripts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host_id:
                  type: integer
                  description: Required. The ID of the host to run the script on.
                script_id:
                  type: integer
                  description: The ID of the existing saved script to run. Only one of either `script_id`, `script_contents`,
                    or `script_name` can be included.
                script_contents:
                  type: string
                  description: The contents of the script to run. Only one of either `script_id`, `script_contents`,
                    or `script_name` can be included. Scripts must be less than 10,000 characters. To run scripts
                    with more than 10k characters, save the script and use `script_id` or `script_name` and `fleet_id`
                    instead.
                script_name:
                  type: integer
                  description: The name of the existing saved script to run. If specified, requires `fleet_id`.
                    Only one of either `script_id`, `script_contents`, or `script_name` can be included in the request.
                fleet_id:
                  type: integer
                  description: The ID of the fleet the existing saved script belongs to. If specified, requires
                    `script_name`. Only one of either `script_id`, `script_contents`, or `script_name` can be included
                    in the request.
              required:
              - host_id
      responses:
        '202':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  host_id:
                    type: integer
                  execution_id:
                    type: string
              example:
                host_id: 1227
                execution_id: e797d6c6-3aae-11ee-be56-0242ac120002
  /api/v1/fleet/scripts/results/{execution_id}:
    get:
      summary: Get script result
