      operationId: get_script_result
      tags:
      - Scripts
      parameters:
      - name: execution_id
        in: path
        required: true
        description: Required. The execution id of the script.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  script_contents:
                    type: string
                  exit_code:
                    type: integer
                  output:
                    type: string
                  message:
                    type: string
                  hostname:
                    type: string
                  host_timeout:
                    type: boolean
                  host_id:
                    type: integer
                  execution_id:
                    type: string
                  runtime:
                    type: integer
