  /api/v1/fleet/hosts/{id}/certificates:
    get:
      summary: Get host's certificates
      description: Available for macOS, iOS, iPadOS, and Windows hosts only. Requires Fleet's MDM to be enabled
        and configured. Retrieves the certificates installed on a host. For macOS hosts, certificates from MDM-delivered
        profiles containing an ACME payload are retrieved via the MDM `CertificateList` command on each profile
        install and re-install (not on a recurring cadence). Hardware-bound ACME certificates that aren't visible
        to osquery first appear in the response after the host installs or re-installs the delivering profile.
      operationId: get_host_s_certificates
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's id.
        schema:
          type: integer
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Options include `common_name` and `not_valid_after`. Default is `common_name`
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: OK
