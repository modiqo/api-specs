      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_executions:
                    type: array
                    items:
                      type: object
                      properties:
                        script_id:
                          type: integer
                        script_name:
                          type: string
                        batch_execution_id:
                          type: string
                        team_id:
                          type: integer
                        fleet_id:
                          type: integer
                        not_before:
                          type: string
                        finished_at:
                          type: string
                        started_at:
                          type: string
                        status:
                          type: string
                        canceled:
                          type: boolean
                        targeted_host_count:
                          type: integer
                        ran_host_count:
                          type: integer
                        pending_host_count:
                          type: integer
                        errored_host_count:
                          type: integer
                        incompatible_host_count:
                          type: integer
                        canceled_host_count:
                          type: integer
                        created_at:
                          type: string
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
                  count:
                    type: integer
              example:
                batch_executions:
                - script_id: 555
                  script_name: my-script.sh
                  batch_execution_id: e797d6c6-3aae-11ee-be56-0242ac120002
                  team_id: 123
                  fleet_id: 123
                  not_before: '2025-07-01T15:00:00Z'
                  finished_at: '2025-07-06T15:00:00Z'
