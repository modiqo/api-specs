                      munki_versions:
                        type: array
                        items:
                          type: object
                          properties:
                            version:
                              type: string
                            hosts_count:
                              type: integer
                      munki_issues:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            type:
                              type: string
                            hosts_count:
                              type: integer
                      mobile_device_management_enrollment_status:
                        type: object
                        properties:
                          enrolled_manual_hosts_count:
                            type: integer
                          enrolled_automated_hosts_count:
                            type: integer
                          unenrolled_hosts_count:
                            type: integer
                      mobile_device_management_solution:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
