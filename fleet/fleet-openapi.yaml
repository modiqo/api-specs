  /api/v1/fleet/translate:
    post:
      summary: Translate IDs
      description: Transforms a host name into a host id. For example, the Fleet UI uses this endpoint when sending
        live reports to a set of hosts.
      operationId: translate_ids
      tags:
      - Translator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                array:
                  type: array
                  items: {}
                  description: Required list of items to translate.
                list:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      payload:
                        type: object
                        properties:
                          identifier:
                            type: string
              required:
              - array
            example:
              list:
              - type: user
                payload:
                  identifier: some@email.com
              - type: label
                payload:
                  identifier: labelA
              - type: team
                payload:
                  identifier: team1
              - type: host
                payload:
                  identifier: host-ABC
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        payload:
                          type: object
                          properties:
                            identifier:
                              type: string
                            id:
                              type: integer
              example:
                list:
                - type: user
                  payload:
                    identifier: some@email.com
                    id: 32
                - type: label
                  payload:
                    identifier: labelA
                    id: 1
                - type: team
                  payload:
                    identifier: team1
                    id: 22
                - type: host
                  payload:
                    identifier: host-ABC
