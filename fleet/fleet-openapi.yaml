  /api/v1/fleet/device/{token}:
    get:
      summary: Get host by Fleet Desktop token
      description: '> If you''re hitting this endpoint often (e.g. every hour) for a large number of hosts (e.g.
        1k+) the best practice is to set the `exclude_software` to `true` to prevent overloading the Fleet server.
        Returns a subset of information about the host specified by `token`. To get all information about a host,
        use the "Get host" endpoint. This is the API route used by the My device page in Fleet Desktop to display
        information about the host to the end user. This endpoint doesn''t require API token authentication. Authentication
        on macOS, Windows, and Linux is enforced by generating a random UUID that rotates hourly. For iOS and iPadOS,
        this is the host''s hardware UUID.'
