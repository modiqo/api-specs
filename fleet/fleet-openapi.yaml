  /api/v1/fleet/hosts/{id}/refetch:
    post:
      summary: Refetch host
      description: Flags the host details, labels and policies to be refetched the next time the host checks in.
        Note that we cannot be certain when the host will actually check in. Further requests to the host APIs will
        indicate that the refetch has been requested through the `refetch_requested` field on the host object.
      operationId: refetch_host
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's id.
        schema:
          type: integer
      responses:
        '200':
          description: Default response
  /api/v1/fleet/device/{token}/refetch:
    post:
      summary: Refetch host by Fleet Desktop token
      description: Same as Refetch host except with the Fleet Desktop token instead the host ID.
      operationId: refetch_host_by_fleet_desktop_token
      tags:
      - Hosts
      parameters:
      - name: token
        in: path
        required: true
        description: Required. The host's Fleet Desktop token.
        schema:
          type: string
      responses:
        '200':
          description: Default response
  /api/v1/fleet/hosts/transfer:
    post:
      summary: Update hosts' fleet
      description: _Available in Fleet Premium_
      operationId: update_hosts_fleet
      tags:
      - Hosts
      x-fleet-premium: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_id:
                  type: integer
                  description: Required. The ID of the fleet you'd like to assign the host(s) to.
                hosts:
                  type: array
                  items:
                    type: integer
                  description: Required. A list of host IDs.
                team_id:
                  type: integer
              required:
              - fleet_id
              - hosts
            example:
              team_id: 1
              fleet_id: 1
              hosts:
              - 3
              - 2
              - 4
              - 6
              - 1
              - 5
              - 7
      responses:
        '200':
          description: Default response
  /api/v1/fleet/hosts/transfer/filter:
    post:
      summary: Update hosts' fleet by filter
      description: _Available in Fleet Premium_
      operationId: update_hosts_fleet_by_filter
      tags:
      - Hosts
      x-fleet-premium: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fleet_id:
                  type: integer
                  description: Required. The ID of the fleet you'd like to assign the host(s) to.
                filters:
                  type: object
                  description: Required. See filters
                  properties:
                    status:
                      type: string
                    team_id:
                      type: integer
                    fleet_id:
                      type: integer
                team_id:
                  type: integer
              required:
              - fleet_id
              - filters
            example:
              team_id: 1
              fleet_id: 1
              filters:
                status: online
                team_id: 2
                fleet_id: 2
      responses:
        '200':
          description: Default response
  /api/v1/fleet/hosts/{id}/mdm:
    delete:
      summary: Turn off host's MDM
      description: Turns off MDM for the specified macOS, iOS, iPadOS, or Android host. > On BYOD Android (work
        profile), Fleet sends a wipe command via the Android Management API. Unlike the delete device command in
        the Android Management API, the wipe command does not expire after 30 days. That way, Fleet makes sure that
        the work profile is wiped even if the host is offline for more than 30 days.
      operationId: turn_off_host_s_mdm
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The host's ID in Fleet.
        schema:
          type: integer
      responses:
        '204':
          description: Default response
    get:
      summary: Get host's mobile device management (MDM) information
      description: Currently supports Windows and macOS. Retrieves a host's MDM enrollment status and MDM server
        URL. If the host exists but is not enrolled to an MDM server, then this API returns `null`.
      operationId: get_host_s_mobile_device_management_mdm_information
      tags:
      - Hosts
      parameters:
      - name: id
        in: path
        required: true
        description: Required The id of the host to get the details for
        schema:
          type: integer
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollment_status:
                    type: string
                  server_url:
                    type: string
                  name:
                    type: string
                  id:
                    type: integer
              example:
                enrollment_status: On (automatic)
                server_url: some.mdm.com
                name: Some MDM
                id: 3
  /api/v1/fleet/hosts/delete:
    post:
      summary: Batch-delete hosts
      description: Delete hosts selected by filter or ids.
      operationId: batch_delete_hosts
      tags:
      - Hosts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: {}
                  description: A list of the host IDs you'd like to delete. Required if `filters` not specified.
                    Only one of `ids` or `filters` may be included in the request.
                filters:
                  type: object
                  description: Required. See filters. Required if `ids` not specified. Only one of `ids` or `filters`
                    may be included in the request.
                  properties:
                    status:
                      type: string
                    team_id:
                      type: integer
                    fleet_id:
                      type: integer
              required:
              - filters
            example:
              filters:
                status: online
                team_id: 1
                fleet_id: 1
      responses:
        '200':
          description: Default response
