                  uploaded_at: '2026-06-04T17:43:46.125681Z'
                  installer_id: 36818
                  install_script: '#!/bin/sh


                    installer -pkg "$INSTALLER_PATH" -target /

                    '
                  pre_install_query: ''
                  post_install_script: ''
                  uninstall_script: "#!/bin/sh\n\n# Fleet extracts and saves package IDs.\npkg_ids=(\n  'com.tinyspeck.slackmacgap'\n\
                    )\n\n# For each package id, get all .app folders associated with the package and remove them.\n\
                    for pkg_id in \"${pkg_ids[@]}\"\ndo\n  # Get volume and location of the package.\n  volume=$(pkgutil\
                    \ --pkg-info \"$pkg_id\" | grep -i \"volume\" | awk '{if (NF>1) print $NF}')\n  location=$(pkgutil\
                    \ --pkg-info \"$pkg_id\" | grep -i \"location\" | awk '{if (NF>1) print $NF}')\n  # Check if\
                    \ this package id corresponds to a valid/installed package\n  if [[ ! -z \"$volume\" ]]; then\n\
                    \    # Remove individual directories that end with \".app\" belonging to the package.\n    #\
