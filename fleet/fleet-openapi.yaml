openapi: 3.0.3
info:
  title: Fleet REST API
  description: Complete OpenAPI specification for the Fleet device management (fleetdm.com) REST API, covering all
    documented endpoints and HTTP methods (GET, POST, PUT, PATCH, DELETE). Generated from Fleet's canonical API
    documentation (docs/REST API/rest-api.md). Endpoints marked x-fleet-premium require a Fleet Premium license.
  version: fleet-v4.88.1
  contact:
    name: Fleet
    url: https://fleetdm.com
  license:
    name: MIT
    url: https://github.com/fleetdm/fleet/blob/main/LICENSE
externalDocs:
  description: Official Fleet REST API documentation
  url: https://fleetdm.com/docs/rest-api/rest-api
servers:
- url: https://{fleetServer}
  description: Your Fleet server
  variables:
    fleetServer:
      default: fleet.example.com
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Fleet API token. Obtain via POST /api/v1/fleet/login or an API-only user. Send as ''Authorization:
        Bearer <token>''.'
paths:
  /api/v1/fleet/login:
    post:
      summary: Log in
      description: Authenticates the user with the specified credentials. Use the token returned from this endpoint
        to authenticate further API requests.
      operationId: log_in
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Required. The user's email.
                password:
                  type: string
                  description: Required. The user's plain text password.
              required:
              - email
              - password
            example:
              email: janedoe@example.com
              password: VArCjNW7CfsxGp67
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      enabled:
                        type: boolean
                      force_password_reset:
                        type: boolean
                      gravatar_url:
                        type: string
                      sso_enabled:
                        type: boolean
                      mfa_enabled:
                        type: boolean
                      global_role:
                        type: string
                      teams:
                        type: array
                        items: {}
                      fleets:
                        type: array
                        items: {}
                  token:
                    type: string
              example:
                user:
                  created_at: '2020-11-13T22:57:12Z'
                  updated_at: '2020-11-13T22:57:12Z'
                  id: 1
                  name: Jane Doe
                  email: janedoe@example.com
                  enabled: true
                  force_password_reset: false
                  gravatar_url: ''
                  sso_enabled: false
                  mfa_enabled: false
                  global_role: admin
                  teams: []
                  fleets: []
                token: '{your token}'
  /api/v1/fleet/logout:
    post:
      summary: Log out
      description: Logs out the authenticated user.
      operationId: log_out
      tags:
      - Authentication
      responses:
        '200':
          description: Default response
  /api/v1/fleet/forgot_password:
    post:
      summary: Forgot password
      description: Sends a password reset email to the specified email. Requires that SMTP or SES is configured
        for your Fleet server.
      operationId: forgot_password
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Required. The email of the user requesting the reset password link.
              required:
              - email
            example:
              email: janedoe@example.com
      responses:
        '200':
          description: Default response
  /api/v1/fleet/change_password:
    post:
      summary: Update password
      operationId: update_password
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  description: Required. The user's old password.
                new_password:
                  type: string
                  description: Required. The user's new password.
              required:
              - old_password
              - new_password
            example:
              old_password: VArCjNW7CfsxGp67
              new_password: zGq7mCLA6z4PzArC
      responses:
        '200':
          description: Default response
  /api/v1/fleet/reset_password:
    post:
      summary: Reset password
      description: Resets a user's password. Which user is determined by the password reset token used. The password
        reset token can be found in the password reset email sent to the desired user.
      operationId: reset_password
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
                  description: Required. The new password.
                new_password_confirmation:
                  type: string
                  description: Required. Confirmation for the new password.
                password_reset_token:
                  type: string
                  description: Required. The token provided to the user in the password reset email.
              required:
              - new_password
              - new_password_confirmation
              - password_reset_token
            example:
              new_password: abc123
              new_password_confirmation: abc123
              password_reset_token: UU5EK0JhcVpsRkY3NTdsaVliMEZDbHJ6TWdhK3oxQ1Q=
      responses:
        '200':
          description: Default response
  /api/v1/fleet/me:
    get:
      summary: Me
      description: Retrieves the user data for the authenticated user.
      operationId: me
      tags:
      - Authentication
      parameters:
      - name: include_ui_settings
        in: query
        description: 'If set to true, includes the columns the user hides on the Hosts page (default: `false`).'
        schema:
          type: boolean
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      global_role:
                        type: string
                      enabled:
                        type: boolean
                      force_password_reset:
                        type: boolean
                      gravatar_url:
                        type: string
                      sso_enabled:
                        type: boolean
                      teams:
                        type: array
                        items: {}
                      fleets:
                        type: array
                        items: {}
                  available_teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                  available_fleets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
              example:
                user:
                  created_at: '2020-11-13T22:57:12Z'
                  updated_at: '2020-11-16T23:49:41Z'
                  id: 1
                  name: Jane Doe
                  email: janedoe@example.com
                  global_role: admin
                  enabled: true
                  force_password_reset: false
                  gravatar_url: ''
                  sso_enabled: false
                  teams: []
                  fleets: []
                available_teams:
                - id: 1
                  name: Workstations
                  description: Employee workstations
                available_fleets:
                - id: 1
                  name: Workstations
                  description: Employee workstations
  /api/v1/fleet/perform_required_password_reset:
    post:
      summary: Perform required password reset
      description: Resets the password of the authenticated user. Requires that `force_password_reset` is set to
        `true` prior to the request.
      operationId: perform_required_password_reset
      tags:
      - Authentication
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                new_password:
                  type: string
            example:
              new_password: sdPz8CV5YhzH47nK
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      enabled:
                        type: boolean
                      force_password_reset:
                        type: boolean
                      gravatar_url:
                        type: string
                      sso_enabled:
                        type: boolean
                      global_role:
                        type: string
                      teams:
                        type: array
                        items: {}
                      fleets:
                        type: array
                        items: {}
              example:
                user:
                  created_at: '2020-11-13T22:57:12Z'
                  updated_at: '2020-11-17T00:09:23Z'
                  id: 1
                  name: Jane Doe
                  email: janedoe@example.com
                  enabled: true
                  force_password_reset: false
                  gravatar_url: ''
                  sso_enabled: false
                  global_role: admin
                  teams: []
                  fleets: []
  /api/v1/fleet/sso:
    get:
      summary: SSO config
      description: Gets the current SSO configuration.
      operationId: sso_config
      tags:
      - Authentication
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      idp_name:
                        type: string
                      idp_image_url:
                        type: string
                      sso_enabled:
                        type: boolean
              example:
                settings:
                  idp_name: IDP Vendor 1
                  idp_image_url: ''
                  sso_enabled: false
    post:
      summary: Initiate SSO
      operationId: initiate_sso
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                relay_url:
                  type: string
                  description: Required. The relative url to be navigated to after successful sign in.
              required:
              - relay_url
            example:
              relay_url: /hosts/manage
      responses:
        '200':
          description: Default response
  /api/v1/fleet/sso/callback:
    post:
      summary: SSO callback
      description: This is the callback endpoint that the identity provider will use to send security assertions
        to Fleet. This is where Fleet receives and processes the response from the identify provider.
      operationId: sso_callback
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                  description: Required. The SAML response from the identity provider.
              required:
              - SAMLResponse
            example:
              SAMLResponse: <SAML response from IdP>
      responses:
        '200':
          description: Default response
  /api/v1/fleet/activities:
    get:
      summary: List activities
      description: Returns a list of the activities that have been performed in Fleet. For a comprehensive list
        of activity types and detailed information, please see the audit logs page.
      operationId: list_activities
      tags:
      - Activities
      parameters:
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page. Maximum is 10,000 records. If no pagination parameters are specified, defaults
          to 10,000.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Can be any column in the `activities` table.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities:
                    type: array
                    items:
                      type: object
                      properties:
                        created_at:
                          type: string
                        id:
                          type: integer
                        actor_full_name:
                          type: string
                        actor_id:
                          type: integer
                        actor_gravatar:
                          type: string
                        actor_email:
                          type: string
                        type:
                          type: string
                        fleet_initiated:
                          type: boolean
                        details:
                          type: object
                          properties:
                            status:
                              type: string
                            host_id:
                              type: integer
                            host_display_name:
                              type: string
                            policy_id:
                              type: integer
                            policy_name:
                              type: string
                            install_uuid:
                              type: string
                            self_service:
                              type: boolean
                            software_title:
                              type: string
                            software_package:
                              type: string
                            team_id:
                              type: integer
                            fleet_id:
                              type: integer
                            team_name:
                              type: string
                            fleet_name:
                              type: string
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
              example:
                activities:
                - created_at: '2023-07-27T14:35:08Z'
                  id: 25
                  actor_full_name: Anna Chao
                  actor_id: 3
                  actor_gravatar: ''
                  actor_email: ''
                  type: installed_software
                  fleet_initiated: false
                  details:
                    status: installed
                    host_id: 1272
                    host_display_name: MacBook Pro
                    policy_id: null
                    policy_name: null
                    install_uuid: 23c18ea1-8cd7-4af4-a1d8-f2666993a66b
                    self_service: false
                    software_title: zoom.us.app
                    software_package: ZoomInstallerIT.pkg
                - created_at: '2021-07-29T14:40:27Z'
                  id: 21
                  actor_full_name: name
                  actor_id: 1
                  actor_gravatar: ''
                  actor_email: name@example.com
                  type: created_fleet
                  fleet_initiated: false
                  details:
                    team_id: 2
                    fleet_id: 2
                    team_name: Apples
                    fleet_name: Apples
                - created_at: '2023-07-27T14:35:08Z'
                  id: 25
                  type: installed_software
                  fleet_initiated: true
                  details:
                    status: installed
                    host_id: 1272
                    host_display_name: MacBook Pro
                    policy_id: 24
                    policy_name: '[Install software] Zoom'
                    install_uuid: 077970ab-0ed6-4573-9cdc-ca9ef9015283
                    self_service: false
                    software_title: zoom.us.app
                    software_package: ZoomInstallerIT.pkg
                meta:
                  has_next_results: false
                  has_previous_results: false
  /api/v1/fleet/certificate_authorities:
    post:
      summary: Connect certificate authority (CA)
      description: Connect Fleet to a certificate authority (CA). Fleet currently supports DigiCert, Microsoft NDES,
        Hydrant, Smallstep, and any custom SCEP or EST CA.
      operationId: connect_certificate_authority_ca
      tags:
      - Certificates
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                digicert:
                  type: object
                  description: See digicert
                  properties:
                    name:
                      type: string
                    url:
                      type: string
                    api_token:
                      type: string
                    profile_id:
                      type: string
                    certificate_common_name:
                      type: string
                    certificate_user_principal_names:
                      type: array
                      items:
                        type: string
                    certificate_seat_id:
                      type: string
                ndes_scep_proxy:
                  type: object
                  description: See ndes_scep_proxy
                custom_scep_proxy:
                  type: object
                  description: See custom_scep_proxy
                custom_est_proxy:
                  type: object
                  description: See custom_est_proxy
                hydrant:
                  type: object
                  description: See hydrant
                smallstep:
                  type: object
                  description: See smallstep
            example:
              digicert:
                name: WIFI_CERTIFICATE
                url: https://one.digicert.com
                api_token: '********'
                profile_id: b416e058-1bdc-4844-9c3f-7c71d58d0eff
                certificate_common_name: $FLEET_VAR_HOST_HARDWARE_SERIAL
                certificate_user_principal_names:
                - $FLEET_VAR_HOST_HARDWARE_SERIAL
                certificate_seat_id: $FLEET_VAR_HOST_END_USER_EMAIL_IDP
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  type:
                    type: string
              example:
                id: 1
                name: WIFI_CERTIFICATE
                type: digicert
    get:
      summary: List certificate authorities (CAs)
      operationId: list_certificate_authorities_cas
      tags:
      - Certificates
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate_authorities:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        type:
                          type: string
              example:
                certificate_authorities:
                - id: 3
                  name: DIGICERT_PROD
                  type: digicert
                - id: 2
                  name: DIGICERT_STAGE
                  type: digicert
                - id: 5
                  name: HYDRANT_WIFI_STAGE
                  type: hydrant
                - id: 1
                  name: NDES_VPN
                  type: ndes_scep_proxy
                - id: 4
                  name: SCEP_CERTIFICATE_PROD
                  type: custom_scep_proxy
                - id: 5
                  name: SECTIGO_WIFI
                  type: custom_est_proxy
                - id: 6
                  name: SMALLSTEP_WIFI
                  type: smallstep
  /api/v1/fleet/certificates:
    post:
      summary: Add certificate template
      description: Add a certificate template to deploy a certificate to all hosts on the fleet. Fleet currently
        supports adding certificates for Android that are issued from a custom SCEP certificate authority.
      operationId: add_certificate_template
      tags:
      - Certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required. The name of the certificate. Name can be used as certificate alias to reference
                    in configuration profiles.
                fleet_id:
                  type: string
                  description: _Available in Fleet Premium_. The ID of the fleet to add profiles to.
                certificate_authority_id:
                  type: integer
                  description: Required. The certificate authority (CA) ID to issue certificate from. Currently,
                    only custom SCEP CA is supported. To get ID use List certificate authorities.
                subject_name:
                  type: string
                  description: 'Required The certificate''s subject name (SN). Separate subject fields with a comma
                    (`,`). For example: "CN=john@example.com,O=Acme Inc.".'
                subject_alternative_name:
                  type: string
                  description: 'The certificate''s subject alternative name (SAN). Separate SAN fields with a comma
                    (`,`). Each field is a key-value pair. See supported keys. Example: `DNS=wifi.example.com, UPN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME`.'
                team_id:
                  type: integer
              required:
              - name
              - certificate_authority_id
              - subject_name
            example:
              name: wifi-certificate
              team_id: 1
              fleet_id: 1
              certificate_authority_id: 1
              subject_name: CN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME, OU=$FLEET_VAR_HOST_UUID, ST=$FLEET_VAR_HOST_HARDWARE_SERIAL
              subject_alternative_name: DNS=example.com, UPN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate_authority_id:
                    type: integer
                  id:
                    type: integer
                  name:
                    type: string
                  subject_name:
                    type: string
                  subject_alternative_name:
                    type: string
              example:
                certificate_authority_id: 1
                id: 1
                name: wifi-certificate
                subject_name: CN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME, OU=$FLEET_VAR_HOST_UUID, ST=$FLEET_VAR_HOST_HARDWARE_SERIAL
                subject_alternative_name: DNS=example.com, UPN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME
    get:
      summary: List certificate templates
      description: List certificates added to Fleet.
      operationId: list_certificate_templates
      tags:
      - Certificates
      parameters:
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. The fleet ID to filter certificate templates. If not specified,
          this defaults to "Unassigned".
        schema:
          type: integer
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: What to order results by. Allowed field is `id`.
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        certificate_authority_id:
                          type: string
                        certificate_authority_name:
                          type: string
                        subject_name:
                          type: string
                        subject_alternative_name:
                          type: string
                        created_at:
                          type: string
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
              example:
                certificates:
                - id: 1
                  name: wifi-certificate
                  certificate_authority_id: '1'
                  certificate_authority_name: PRODUCTION_SCEP_SERVER
                  subject_name: CN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME, OU=$FLEET_VAR_HOST_UUID, ST=$FLEET_VAR_HOST_HARDWARE_SERIAL
                  subject_alternative_name: DNS=example.com, UPN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME
                  created_at: '2025-11-04T00:00:00Z'
                - id: 2
                  name: vpn-certificate
                  certificate_authority_id: '1'
                  certificate_authority_name: PRODUCTION_SCEP_SERVER
                  subject_name: CN=$FLEET_VAR_HOST_END_USER_IDP_USERNAME, OU=$FLEET_VAR_HOST_UUID
                  created_at: '2025-11-04T00:00:00Z'
                meta:
                  has_next_results: false
                  has_previous_results: false
  /api/v1/fleet/certificate_authorities/{id}:
    patch:
      summary: Update certificate authority (CA)
      operationId: update_certificate_authority_ca
      tags:
      - Certificates
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The certificate authority (CA) ID in Fleet. You can see your CAs IDs using the List
          certificate authorities endpoint.
        schema:
          type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                digicert:
                  type: object
                  description: See digicert
                  properties:
                    certificate_common_name:
                      type: string
                ndes_scep_proxy:
                  type: object
                  description: See ndes_scep_proxy
                custom_scep_proxy:
                  type: object
                  description: See custom_scep_proxy
                custom_est_proxy:
                  type: object
                  description: See custom_est_proxy
                hydrant:
                  type: object
                  description: See hydrant
                smallstep:
                  type: object
                  description: See smallstep
            example:
              digicert:
                certificate_common_name: $FLEET_VAR_HOST_HARDWARE_SERIAL
      responses:
        '200':
          description: Default response
    get:
      summary: Get certificate authority (CA)
      description: Get details of the certificate authority.
      operationId: get_certificate_authority_ca
      tags:
      - Certificates
      parameters:
