  /api/v1/fleet/commands/run:
    post:
      summary: Run MDM command
      description: '> `POST /api/v1/fleet/mdm/apple/enqueue` API endpoint is deprecated as of Fleet 4.40. It is
        maintained for backward compatibility. Please use the new API endpoint below. Archived documentation is
        available for the deprecated endpoint. This endpoint tells Fleet to run a custom MDM command on the targeted
        macOS, iOS, iPadOS, or Windows hosts the next time they come online. > This endpoint accepts a maximum request
        body size of 2MiB.'
      operationId: run_mdm_command
      tags:
      - Commands
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  command_uuid:
                    type: string
                  request_type:
                    type: string
              example:
                command_uuid: a2064cef-0000-1234-afb9-283e3c1d487e
                request_type: ProfileList
  /api/v1/fleet/commands/results:
    get:
      summary: Get MDM command results
      description: '> `GET /api/v1/fleet/mdm/apple/commandresults` API endpoint is deprecated as of Fleet 4.40.
        It is maintained for backward compatibility. Please use the new API endpoint below. Archived documentation
        is available for the deprecated endpoint. This endpoint returns the results for a specific custom MDM command.
        In the response, the possible `status` values for macOS, iOS, and iPadOS hosts are the following: * Pending:
        the command has yet to run on the host. The host will run the command the next time it comes online. * NotNow:
        the host acknowledged the MDM command but couldn’t run for one of Apple''s documented reasons. Per Apple,
        the host retries automatically. Apple doesn’t specify when the retries happen, or whether they depend on
        clearing _all_ blocking reasons or just one. * Acknowledged: the host responded with "Acknowledged" status
        via the MDM protocol: the host processed the command successfully. * Error: the host responded with "Error"
        status via the MDM protocol: an error occurred. Run the `fleetctl get mdm-command-results --id=<insert-command-id`
        to view the error. * CommandFormatError: the host responded with "CommandFormatError" status via the MDM
        protocol: a protocol error occurred, which can result from a malformed command. Run the `fleetctl get mdm-command-results
        --id=<insert-command-id` to view the error. The possible `status` values for Windows hosts are listed in
        Microsoft''s OMA DM documentation.'
      operationId: get_mdm_command_results
      tags:
      - Commands
      parameters:
      - name: command_uuid
        in: query
        description: The unique identifier of the command.
        schema:
          type: string
      - name: host_identifier
        in: query
        description: The host's `hostname`, `uuid`, or `hardware_serial`. Returns only results for the specified
          host.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        host_uuid:
                          type: string
                        command_uuid:
                          type: string
                        status:
                          type: string
                        updated_at:
                          type: string
                        request_type:
                          type: string
                        hostname:
                          type: string
                        payload:
                          type: string
                        result:
                          type: string
              example:
                results:
                - host_uuid: 145cafeb-87c7-4869-84d5-e4118a927746
                  command_uuid: a2064cef-0000-1234-afb9-283e3c1d487e
                  status: Acknowledged
                  updated_at: 2023-04-04:00:00Z
                  request_type: ProfileList
                  hostname: mycomputer
                  payload: 
                  result: 
  /api/v1/fleet/commands:
    get:
      summary: List MDM commands
      description: '> `GET /api/v1/fleet/mdm/apple/commands` API endpoint is deprecated as of Fleet 4.40. It is
        maintained for backward compatibility. Please use the new API endpoint below. Archived documentation is
        available for the deprecated endpoint. This endpoint returns the list of custom MDM commands that have been
        executed.'
      operationId: list_mdm_commands
      tags:
      - Commands
      parameters:
      - name: host_identifier
        in: query
        description: Required. The host's `hostname`, `uuid`, or `hardware_serial`. Returns only commands that target
          the specified host. Omitting `host_identifier` is deprecated (see the deprecation notice below). Requests
          w/o it continue to work for backward compatibility but are not recommended; the underlying query is not
          performant at scale and may time out on large fleets. Support will be removed in Fleet 5.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: Page number of the results to fetch. Maximum is `100`.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page. Default is `10`. Maximum is 1,000 records.
        schema:
          type: integer
      - name: order_key
        in: query
        description: 'What to order results by. Allowed values: `host_uuid`, `command_uuid`, `status`, `updated_at`,
          `request_type`, `hostname`. Default is `updated_at`.'
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: request_type
        in: query
        description: The request type to filter commands by.
        schema:
          type: string
      - name: command_status
        in: query
        description: 'Comma-separated string of one of the following options: ''ran'', ''pending'', or ''failed''.'
        schema:
          type: string
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
                  count:
                    nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        host_uuid:
                          type: string
                        command_uuid:
                          type: string
                        status:
                          type: string
                        command_status:
                          type: string
                        updated_at:
                          type: string
                        request_type:
                          type: string
                        name:
                          nullable: true
                        hostname:
                          type: string
              example:
                meta:
                  has_next_results: true
                  has_previous_results: false
                count: null
                results:
                - host_uuid: A1B2C3D4-E5F6-7890-1234-567890ABCDEF
                  command_uuid: a3650ec9-6dd0-40e9-b5d8-feffe9939461
                  status: Acknowledged
                  command_status: ran
                  updated_at: '2026-03-20T19:45:27Z'
                  request_type: DeclarativeManagement
                  name: null
                  hostname: Mac-mini.local
                - host_uuid: A1B2C3D4-E5F6-7890-1234-567890ABCDEF
                  command_uuid: 97ceaa39-eadc-4953-98a8-2ffe72ab120d
                  status: Error
                  command_status: failed
                  updated_at: '2026-03-24T21:37:32Z'
                  request_type: InstallProfile
                  name: null
                  hostname: Mac-mini.local
