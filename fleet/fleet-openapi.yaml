    post:
      summary: Search targets
      description: The search targets endpoint returns two lists. The first list includes the possible target hosts
        in Fleet given the search query provided and the hosts already selected as targets. The second list includes
        the possible target labels in Fleet given the search query provided and the labels already selected as targets.
        The returned lists are filtered based on the hosts the requesting user has access to.
      operationId: search_targets
      tags:
      - Targets
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: The search query. Searchable items include a host's hostname or IPv4 address and
                    labels.
                query_id:
                  type: integer
                  description: The saved query (if any) that will be run. The `observer_can_run` property on the
                    query and the user's roles effect which targets are included.
                selected:
                  type: object
                  description: The targets already selected. The object includes a `hosts` property which contains
                    a list of host IDs, a `labels` with label IDs and/or a `fleets` property with fleet IDs.
                  properties:
                    hosts:
                      type: array
                      items: {}
                    labels:
                      type: array
                      items:
                        type: integer
                include_observer:
                  type: boolean
            example:
              query: '172'
              selected:
                hosts: []
                labels:
                - 7
              include_observer: true
