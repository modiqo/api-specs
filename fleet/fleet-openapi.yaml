        this endpoint.
      operationId: update_self_service_category
      tags:
      - Self-service categories
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The self-service category ID.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required. The new category name. Must be unique within the fleet (case-insensitive)
                    and at most 255 characters. Emojis are supported and are part of the name.
              required:
              - name
            example:
              name: 💼 Engineering tools
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  self_service_category:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      fleet_id:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
              example:
                self_service_category:
                  id: 42
                  name: 💼 Engineering tools
                  fleet_id: 3
                  created_at: '2026-05-12T18:45:00Z'
                  updated_at: '2026-05-12T19:01:00Z'
    delete:
      summary: Delete self-service category
      description: Deletes the specified self-service category. Software assigned to the deleted category is removed
        from that category but otherwise unaffected. Only global and fleet admins and maintainers can call this
        endpoint.
      operationId: delete_self_service_category
      tags:
      - Self-service categories
      parameters:
      - name: id
        in: path
        required: true
        description: Required. The self-service category ID.
        schema:
          type: integer
      responses:
        '204':
          description: Default response
  /api/v1/fleet/vulnerabilities:
    get:
      summary: List vulnerabilities
      description: Retrieves a list of all CVEs affecting software and/or OS versions.
      operationId: list_vulnerabilities
      tags:
      - Vulnerabilities
      parameters:
      - name: fleet_id
        in: query
        description: _Available in Fleet Premium_. Filters only include vulnerabilities affecting the specified
          fleet. Use `0` to filter by "Unassigned" hosts.
        schema:
          type: integer
      - name: page
        in: query
        description: Page number of the results to fetch.
        schema:
          type: integer
      - name: per_page
        in: query
        description: Results per page.
        schema:
          type: integer
      - name: order_key
        in: query
        description: 'What to order results by. Allowed fields are: `cve`, `cvss_score`, `epss_probability`, `cve_published`,
          `created_at`, and `host_count`. Default is `created_at` (descending).'
        schema:
          type: string
      - name: order_direction
        in: query
        description: Requires `order_key`. The direction of the order given the order key. Options include `"asc"`
          and `"desc"`. Default is `"asc"`.
        schema:
          type: string
      - name: query
        in: query
        description: Search query keywords. Searchable fields include `cve`.
        schema:
          type: string
      - name: exploit
        in: query
        description: '_Available in Fleet Premium_. If `true`, filters to only include vulnerabilities that have
          been actively exploited in the wild (`cisa_known_exploit: true`). Otherwise, includes vulnerabilities
          with any `cisa_known_exploit` value.'
        schema:
          type: boolean
      - name: after
        in: query
        description: The value to get results after. This needs `order_key` defined, as that's the column that would
          be used.
        schema:
          type: string
      responses:
        '200':
          description: Default response
          content:
            application/json:
              schema:
                type: object
                properties:
                  vulnerabilities:
                    type: array
                    items:
                      type: object
                      properties:
                        cve:
                          type: string
                        created_at:
                          type: string
                        hosts_count:
                          type: integer
                        hosts_count_updated_at:
                          type: string
                        details_link:
                          type: string
                        cvss_score:
                          type: number
                        epss_probability:
                          type: number
                        cisa_known_exploit:
                          type: boolean
                        cve_published:
                          type: string
                        cve_description:
                          type: string
                  count:
                    type: integer
                  counts_updated_at:
                    type: string
                  meta:
                    type: object
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
              example:
                vulnerabilities:
                - cve: CVE-2022-30190
                  created_at: '2022-06-01T00:15:00Z'
                  hosts_count: 1234
                  hosts_count_updated_at: '2023-12-20T15:23:57Z'
                  details_link: https://nvd.nist.gov/vuln/detail/CVE-2022-30190
                  cvss_score: 7.8
                  epss_probability: 0.9729
                  cisa_known_exploit: false
                  cve_published: '2022-06-01T00:15:00Z'
                  cve_description: Microsoft Windows Support Diagnostic Tool (MSDT) Remote Code Execution Vulnerability.
                count: 123
                counts_updated_at: '2024-02-02T16:40:37Z'
                meta:
                  has_next_results: false
                  has_previous_results: false
